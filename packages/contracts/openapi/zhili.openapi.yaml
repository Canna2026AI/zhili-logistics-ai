components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: zhili_access
  headers:
    ETag:
      description: Quoted aggregate version for If-Match.
      schema:
        type: string
        examples: ['"7"']
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for the same intended command, retained for at least 24 hours.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag returned by the latest resource representation.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        Must be absent for CREATE mode and must contain the latest strong ETag for UPDATE mode.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque signed continuation token bound to the original normalized filters, immutable order
        tuple and asOf snapshot. Reusing it with different filters is rejected.
      schema: {$ref: '#/components/schemas/OpaqueCursor'}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    QuoteStatusFilter:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [DRAFT, CALCULATED, ACCEPTED, EXPIRED]}
    OrderStatusFilter:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [DRAFT, VALIDATED, SUBMITTED, CANCELLED]}
    WaybillStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [DRAFT, FORECASTED, AWAITING_RECEIPT, RECEIVED, AWAITING_ROUTING, AWAITING_TRANSIT, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, AWAITING_RETURN, RETURNED, CANCELLED]
    ImportStatusFilter:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [UPLOADED, MAPPING, VALIDATING, READY, COMMITTING, COMPLETED, FAILED, ROLLED_BACK]}
    WarehouseReceiptStatusFilter:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [SCANNED, CONFIRMED, UNDONE]}
    LoadUnitStatusFilter:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [OPEN, SEALED, DISPATCHED]}
    BookingStatusFilter:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [DRAFT, CONFIRMED, DEPARTED, CLOSED, CANCELLED]}
    LastMileIntakeStatusFilter:
      name: status
      in: query
      required: false
      schema: {type: string, enum: [OPEN, RECONCILING, CLOSED]}
    DeliveryTaskStatusFilter:
      name: status
      in: query
      required: false
      schema: {$ref: '#/components/schemas/DeliveryTaskStatus'}
    CustomerIdFilter:
      name: customerId
      in: query
      required: false
      schema: {$ref: '#/components/schemas/Ulid'}
    WarehouseIdFilter:
      name: warehouseId
      in: query
      required: false
      schema: {$ref: '#/components/schemas/Ulid'}
    StationCodeFilter:
      name: stationCode
      in: query
      required: false
      schema: {type: string, minLength: 2, maxLength: 16, pattern: '^[A-Z0-9_-]+$'}
    Search:
