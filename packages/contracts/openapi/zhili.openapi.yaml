openapi: 3.1.0
info:
  title: Zhili Logistics AI API
  version: 0.1.0
  summary: Contract-first API for 智立科技物流AI系统
  description: >-
    Public and first-party contract. Mutating domain commands require an
    Idempotency-Key; commands against an existing aggregate also require
    If-Match. Permissions are documented with x-permission and successful
    commands emit the x-audit-event event.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Interactive authentication and session lifecycle.
  - name: Permissions
    description: Role policy evaluation and audited simulation.
  - name: Platform
    description: SaaS tenant control plane and audited impersonation.
  - name: Customers
    description: Tenant-scoped customers and settlement policies.
  - name: MasterData
    description: Versioned organizations, users, partners and reference data.
  - name: Rates
    description: Channel products, rate cards, prices, surcharges and restrictions.
  - name: Orders
    description: Customer order drafts and validation.
  - name: Quotes
    description: Versioned multi-channel rates and explanations.
  - name: Waybills
    description: Shipment state and explicit domain commands.
  - name: Warehouse
    description: Receiving, routing, loading and dispatch operations.
  - name: Devices
    description: PDA offline event synchronization and conflicts.
  - name: Linehaul
    description: Booking, consolidation and load-unit operations.
  - name: LastMile
    description: Intake, delivery tasks and proof of delivery.
  - name: Tracking
    description: Deduplicated and out-of-order tracking events.
  - name: Issues
    description: Operational exceptions and customer collaboration.
  - name: Notifications
    description: Customer-visible notification delivery requests.
  - name: Finance
    description: Logistics receivables, payables, statements and allocation.
  - name: Payments
    description: Logistics prepayment and WeChat payment lifecycle.
  - name: Imports
    description: Validated, versioned and reversible import jobs.
  - name: AI
    description: Policy-bound AI suggestions and approvals.
  - name: Jobs
    description: Durable asynchronous work and resumable progress.
  - name: Documents
    description: Templates, printing and audited exports.
  - name: Reports
    description: Reconciled business and finance reporting.
  - name: Automation
    description: Versioned rules, execution and replay.
  - name: Integrations
    description: API clients, webhooks and external connectors.
  - name: Portals
    description: Customer portal aggregate views and requests.
  - name: Operations
    description: Health, recovery and migration control operations.
paths:
  /health/live:
    get:
      tags: [Operations]
      operationId: getServiceLiveness
      summary: Confirm that the API process can serve requests
      security: []
      x-feature-id: OPS-HEALTH-LIVE
      responses:
        '200':
          description: API process is live; dependency state is intentionally not consulted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '429':
          $ref: '#/components/responses/RateLimited'
  /health/ready:
    get:
      tags: [Operations]
      operationId: getServiceReadiness
      summary: Report bounded PostgreSQL Redis and object-storage readiness probes
      security: []
      x-feature-id: OPS-HEALTH-READY
      responses:
        '200':
          description: Every required dependency is ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: At least one required dependency is unavailable or timed out.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /auth/password/sessions:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Create a password-authenticated session
      security: []
      x-feature-id: IAM-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
      responses:
        '200':
          description: Authenticated session; refresh token is set as HttpOnly cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sessions:refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the current refresh session
      x-feature-id: IAM-03
      responses:
        '200':
          description: Rotated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/sessions/current:
    delete:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      x-feature-id: IAM-01
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /iam/roles/{roleId}/policy:
    put:
      tags: [Permissions]
      operationId: updateRolePolicy
      summary: Replace a versioned role policy
      x-feature-id: IAM-04
      x-permission: iam.policy.write
      x-audit-event: iam.role-policy.updated
      parameters:
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRolePolicyRequest'
      responses:
        '200':
          description: Role policy updated after lockout checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePolicyResponse'
        '409':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/InvariantFailed'
  /iam/users/{userId}/effective-permissions:preview:
    post:
      tags: [Permissions]
      operationId: previewEffectivePermissions
      summary: Preview effective permissions and policy differences
      x-feature-id: IAM-06
      x-permission: iam.policy.read
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionPreviewRequest'
      responses:
        '200':
          description: Effective actions, data scopes and field policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPreviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /iam/permission-simulations:
    post:
      tags: [Permissions]
      operationId: startPermissionSimulation
      summary: Start an audited user-perspective simulation
      x-feature-id: IAM-06
      x-permission: iam.simulate
      x-audit-event: iam.permission-simulation.started
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPermissionSimulationRequest'
      responses:
        '201':
          description: Short-lived simulation session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSimulationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /iam/permission-simulations/{simulationId}:verify:
    post:
      tags: [Permissions]
      operationId: verifyAsSubject
      summary: Verify one resource action as the simulated subject
      x-feature-id: IAM-06
      x-permission: iam.simulate
      parameters:
        - $ref: '#/components/parameters/SimulationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPermissionRequest'
      responses:
        '200':
          description: Deterministic permission decision and policy trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionDecisionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '410':
          $ref: '#/components/responses/Expired'
  /iam/permission-simulations/{simulationId}:
    delete:
      tags: [Permissions]
      operationId: endPermissionSimulation
      summary: End a permission simulation
      x-feature-id: IAM-06
      x-permission: iam.simulate
      x-audit-event: iam.permission-simulation.ended
      parameters:
        - $ref: '#/components/parameters/SimulationId'
      responses:
        '204':
          description: Simulation ended.
        '404':
          $ref: '#/components/responses/NotFound'
  /platform/tenants:
    post:
      tags: [Platform]
      operationId: createTenant
      summary: Create a SaaS tenant
      x-feature-id: PLT-01
      x-permission: platform.tenant.manage
      x-audit-event: platform.tenant.created
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/impersonations:
    post:
      tags: [Platform]
      operationId: startImpersonation
      summary: Start an audited tenant impersonation
      x-feature-id: PLT-03
      x-permission: platform.impersonate
      x-audit-event: platform.impersonation.started
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartImpersonationRequest'
      responses:
        '201':
          description: Time-limited impersonation session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/impersonations/current:
    delete:
      tags: [Platform]
      operationId: endImpersonation
      summary: End the current tenant impersonation
      x-feature-id: PLT-03
      x-audit-event: platform.impersonation.ended
      responses:
        '204':
          description: Returned to platform context.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a tenant-scoped customer
      x-feature-id: MDM-03
      x-permission: customer.write
      x-audit-event: customer.created
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created in current tenant.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List order projections using a stable cursor
      x-feature-id: ORD-01
      x-permission: order.read
      x-stable-cursor:
        snapshot: asOf
        filterHash: REQUIRED
        order: ['updatedAt:DESC', 'id:DESC']
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/OrderStatusFilter'
        - $ref: '#/components/parameters/CustomerIdFilter'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Stable order page ordered by updatedAt and id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          $ref: '#/components/responses/CursorFilterMismatch'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Orders]
      operationId: createOrderDraft
      summary: Create an order draft
      x-feature-id: ORD-01
      x-permission: order.create
      x-audit-event: order.draft.created
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderDraftRequest'
      responses:
        '201':
          description: Draft created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get one order projection
      x-feature-id: ORD-01
      x-permission: order.read
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Current order projection.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}:validate:
    post:
      tags: [Orders]
      operationId: validateOrder
      summary: Validate an order draft
      x-feature-id: ORD-02
      x-permission: order.validate
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Address, commodity and restriction validation.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderValidationResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /orders/{orderId}:submit:
    post:
      tags: [Orders]
      operationId: submitOrder
      summary: Submit a validated order forecast
      x-feature-id: ORD-02
      x-permission: order.submit
      x-audit-event: order.submitted
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Authoritative submitted order projection.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/StateTransitionFailed'
  /quotes:
    get:
      tags: [Quotes]
      operationId: listQuotes
      summary: List quote projections using a stable cursor
      x-feature-id: RATE-06
      x-permission: quote.read
      x-stable-cursor:
        snapshot: asOf
        filterHash: REQUIRED
        order: ['createdAt:DESC', 'id:DESC']
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/QuoteStatusFilter'
        - $ref: '#/components/parameters/CustomerIdFilter'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Stable quote page ordered by createdAt and id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteListResponse'
        '400':
          $ref: '#/components/responses/CursorFilterMismatch'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Quotes]
      operationId: createQuote
      summary: Calculate a versioned multi-channel quote
      x-feature-id: RATE-06
      x-permission: quote.create
      x-audit-event: quote.created
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: Quote with immutable calculation input snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /quotes/{quoteId}:
    get:
      tags: [Quotes]
      operationId: getQuote
      summary: Get one quote projection
      x-feature-id: RATE-06
      x-permission: quote.read
      parameters:
        - $ref: '#/components/parameters/QuoteId'
      responses:
        '200':
          description: Current quote projection.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /quotes/{quoteId}/explanation:
    get:
      tags: [Quotes]
      operationId: getQuoteExplanation
      summary: Get a rule-by-rule quote explanation
      x-feature-id: RATE-07
      x-permission: quote.read
      parameters:
        - $ref: '#/components/parameters/QuoteId'
      responses:
        '200':
          description: Rule-by-rule calculation explanation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteExplanationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /quotes/{quoteId}:accept:
    post:
      tags: [Quotes]
      operationId: acceptQuote
      summary: Accept one quote option
      x-feature-id: RATE-07
      x-permission: quote.accept
      x-audit-event: quote.accepted
      parameters:
        - $ref: '#/components/parameters/QuoteId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptQuoteRequest'
      responses:
        '200':
          description: Accepted quote version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '410':
          $ref: '#/components/responses/Expired'
  /orders/{orderId}:link-accepted-quote:
    post:
      tags: [Orders]
      operationId: linkAcceptedQuoteToOrder
      summary: Link an accepted quote option to an order and create its draft waybill
      description: >-
        Atomically proves the exact acceptedQuoteVersion and option are accepted and unexpired,
        links the immutable quote snapshot to the order, and creates or idempotently replays exactly
        one link and draft waybill identity. The response ETag always represents the order aggregate.
      x-feature-ids: [RATE-07, ORD-05]
      x-permission: order.quote.link
      x-audit-event: order.accepted-quote.linked
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkAcceptedQuoteToOrderRequest'
      responses:
        '200':
          description: Existing idempotent link replayed.
          headers:
            ETag:
              description: Strong ETag for the order aggregate, derived from data.orderVersion.
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedQuoteOrderLinkResponse'
        '201':
          description: Quote linked and draft waybill created.
          headers:
            ETag:
              description: Strong ETag for the order aggregate, derived from data.orderVersion.
              schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedQuoteOrderLinkResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AcceptedQuoteLinkNotFound'
        '410':
          $ref: '#/components/responses/Expired'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/StateTransitionFailed'
  /waybills:
    get:
      tags: [Waybills]
      operationId: listWaybills
      summary: List operational waybill projections using a stable cursor
      x-feature-id: ORD-05
      x-permission: waybill.read
      x-stable-cursor:
        snapshot: asOf
        filterHash: REQUIRED
        order: ['updatedAt:DESC', 'id:DESC']
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/WaybillStateFilter'
        - $ref: '#/components/parameters/CustomerIdFilter'
        - $ref: '#/components/parameters/WarehouseIdFilter'
        - $ref: '#/components/parameters/StationCodeFilter'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Stable waybill page ordered by updatedAt and id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillListResponse'
        '400':
          $ref: '#/components/responses/CursorFilterMismatch'
        '403':
          $ref: '#/components/responses/Forbidden'
  /waybills/{waybillId}:
    get:
      tags: [Waybills]
      operationId: getWaybill
      summary: Get a waybill and its allowed actions
      x-feature-id: ORD-05
      x-permission: waybill.read
      parameters:
        - $ref: '#/components/parameters/WaybillId'
      responses:
        '200':
          description: Waybill projection with allowed actions.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /waybills/{waybillId}:submit:
    post:
      tags: [Waybills]
      operationId: submitWaybill
      summary: Submit a waybill forecast
      x-feature-id: ORD-07
      x-permission: waybill.submit
      x-audit-event: waybill.submitted
      parameters:
        - $ref: '#/components/parameters/WaybillId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Submitted forecast.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaybillResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/StateTransitionFailed'
  /warehouse/scans:receive:
    post:
      tags: [Warehouse]
      operationId: receiveScan
      summary: Record an idempotent receiving scan
      x-feature-id: WH-01
      x-permission: warehouse.receive
      x-audit-event: warehouse.receive.scan.recorded
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveScanRequest'
      responses:
        '200':
          description: Applied scan or original result for a duplicate.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveScanResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /warehouse/receipts:
    get:
      tags: [Warehouse]
      operationId: listWarehouseReceipts
      summary: List warehouse receipts using a stable cursor
      x-feature-id: WH-03
      x-permission: warehouse.receipt.read
      x-stable-cursor:
        snapshot: asOf
