        waybillId: {$ref: '#/components/schemas/Ulid'}
        source: {type: string}
        statusCode: {type: string}
        location: {type: string}
        description: {type: string}
        occurredAt: {type: string, format: date-time}
        receivedAt: {type: string, format: date-time}
    TrackingEvent:
      type: object
