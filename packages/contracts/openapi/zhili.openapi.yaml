        Canonical state machine: PLANNED -> PALLETIZED -> LOADED -> OUT_FOR_DELIVERY -> COMPLETED.
        PLANNED, PALLETIZED, LOADED, OUT_FOR_DELIVERY and COMPLETED may each transition to EXCEPTION.
        EXCEPTION is terminal; COMPLETED has no forward transition other than EXCEPTION.
      enum: [PLANNED, PALLETIZED, LOADED, OUT_FOR_DELIVERY, COMPLETED, EXCEPTION]
    DeliveryTask:
      type: object
      additionalProperties: false
      required: [id, taskNo, status, waybillCount, version]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        taskNo: {type: string}
        status: {$ref: '#/components/schemas/DeliveryTaskStatus'}
        waybillCount: {type: integer, minimum: 1}
        version: {type: integer, minimum: 1}
    DeliveryTaskResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/DeliveryTask'}
        meta: {$ref: '#/components/schemas/Meta'}
    DeliveryScanEvidence:
      type: object
      additionalProperties: false
      required: [scannedCode]
