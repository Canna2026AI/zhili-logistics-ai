        Only this authoritative deliveryTask status and version may update or clear client state.
      required: [deviceEventId, disposition, deliveryTask, claimedMediaRefs]
      properties:
        deviceEventId: {$ref: '#/components/schemas/Ulid'}
        disposition: {$ref: '#/components/schemas/LastMileDeviceCommandDisposition'}
        deliveryTask: {$ref: '#/components/schemas/DeliveryTask'}
        claimedMediaRefs:
          type: array
          uniqueItems: true
          items: {type: string}
    DeliveryTaskTransitionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/DeliveryTaskTransitionReceipt'}
        meta: {$ref: '#/components/schemas/Meta'}
    CaptureProofOfDeliveryRequest:
      type: object
      additionalProperties: false
      required: [deviceEventId, recipientName, signedAt, evidenceRefs]
      properties:
        deviceEventId: {$ref: '#/components/schemas/Ulid'}
        recipientName: {type: string}
        signedAt: {type: string, format: date-time}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        evidenceRefs:
          type: array
          minItems: 1
          description: Scoped media reservations whose eventId must equal deviceEventId.
          items: {type: string}
        note: {type: string}
    ProofOfDelivery:
      type: object
      required: [id, deliveryTaskId, versionNo, recipientName, signedAt, evidenceRefs]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        deliveryTaskId: {$ref: '#/components/schemas/Ulid'}
        versionNo: {type: integer, minimum: 1}
        recipientName: {type: string}
        signedAt: {type: string, format: date-time}
        evidenceRefs: {type: array, items: {type: string}}
    ProofOfDeliveryCaptureReceipt:
      type: object
      additionalProperties: false
      description: >-
