  /devices/{deviceId}/media:
    post:
      tags: [Devices]
      operationId: uploadDeviceMedia
      summary: Upload or resume one scoped PDA media reservation
      description: >-
        Stores encrypted-in-transit media against the authenticated tenant, warehouse,
        subject, device and client event scope. Upload alone creates a reservation and
        never completes business processing. The reservation becomes READY only after
        an atomic transition or POD claim, or after device event sync returns APPLIED
        or DUPLICATE for the same eventId. Unclaimed reservations expire by policy.
      x-feature-id: PDA-03
      x-permission: pda.sync
      x-audit-event: device.media.uploaded
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadDeviceMediaRequest'
      responses:
        '201':
          description: Scoped reservation created or its idempotent result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMediaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /devices/{deviceId}/takeover-exports:authorize:
    post:
      tags: [Devices]
      operationId: authorizeDeviceTakeoverExport
      summary: Authorize one short-lived encrypted PDA takeover export
      description: >-
        Authorizes the current administrator and server-owned device scope before any
        export bytes leave the PDA. The response supplies an ephemeral RSA-OAEP-256
        public key. The client cannot self-authorize and must never submit plaintext
        events, manifests, media or content-encryption keys.
      x-feature-id: PDA-04
      x-permission: pda.takeover.export
      x-audit-event: device.takeover-export.authorized
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeDeviceTakeoverExportRequest'
      responses:
        '201':
          description: Short-lived server authorization and wrapping key issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTakeoverExportAuthorizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /devices/{deviceId}/takeover-exports/{authorizationId}:
    post:
      tags: [Devices]
      operationId: uploadEncryptedDeviceTakeoverExport
      summary: Upload an authorized encrypted PDA event and media package
      description: >-
        Accepts only an AES-256-GCM ciphertext containing the complete canonical
        manifest, DeviceEvent envelopes and referenced media. The AES key must be
        wrapped by the authorization RSA-OAEP-256 public key; the GCM authentication
        tag is appended to ciphertext. Plaintext event, manifest and media parts are
        forbidden. Authorization scope, expiry, manifest hash and ciphertext hash are
        verified before a receipt can become VERIFIED.
      x-feature-id: PDA-04
      x-permission: pda.takeover.export
      x-audit-event: device.takeover-export.uploaded
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/TakeoverAuthorizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadEncryptedDeviceTakeoverExportRequest'
      responses:
        '201':
          description: Auditable encrypted export receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTakeoverExportReceiptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Expired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
