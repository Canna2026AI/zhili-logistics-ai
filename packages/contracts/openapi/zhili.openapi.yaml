    LoadUnitResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/LoadUnit'}
        meta: {$ref: '#/components/schemas/Meta'}
    AttachWaybillsRequest:
      type: object
      required: [waybillIds]
      properties:
        waybillIds:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Ulid'}
