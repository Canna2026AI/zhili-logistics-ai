        aggregate. Only this authoritative deliveryTask status and version may update or
        clear client state; claimedMediaRefs are safe for successful local cleanup.
      required: [deviceEventId, disposition, deliveryTask, proofOfDelivery, claimedMediaRefs]
      properties:
        deviceEventId: {$ref: '#/components/schemas/Ulid'}
        disposition: {$ref: '#/components/schemas/LastMileDeviceCommandDisposition'}
        deliveryTask: {$ref: '#/components/schemas/DeliveryTask'}
        proofOfDelivery: {$ref: '#/components/schemas/ProofOfDelivery'}
        claimedMediaRefs:
          type: array
          uniqueItems: true
          items: {type: string}
    ProofOfDeliveryCaptureResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/ProofOfDeliveryCaptureReceipt'}
        meta: {$ref: '#/components/schemas/Meta'}
    IngestTrackingEventRequest:
