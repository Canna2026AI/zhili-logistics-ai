  responses:
    Unauthorized:
      description: Session missing, expired or reauthentication required.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example:
            code: SESSION_EXPIRED
            message: Session expired.
            details: []
            remediation: Sign in again; locally persisted PDA events remain protected.
            requestId: req_01JY8Z8F
    Forbidden:
      description: Action, data scope or field policy denied.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example:
            code: PERMISSION_DENIED
            message: Missing action permission.
            details: [{field: permission, reason: warehouse.receive}]
            remediation: Request the listed permission from a tenant administrator.
            requestId: req_01JY8Z8F
    NotFound:
      description: Resource not found in caller data scope.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example:
            code: NOT_FOUND
            message: Resource not found in the caller data scope.
            details: [{field: resourceId, reason: resource is absent or outside the caller scope}]
            remediation: Check the identifier and current data scope before retrying.
            requestId: req_01JY8Z8F
    AcceptedQuoteLinkNotFound:
      description: The order, accepted quote version or quote option is absent or outside caller scope.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example:
            code: NOT_FOUND
            message: Accepted quote linkage input was not found in the caller data scope.
            details: [{field: acceptedQuoteVersion, reason: quote snapshot is absent or inaccessible}]
            remediation: Reload the order and accepted quote snapshot before retrying.
            requestId: req_01JY8Z8F
    CursorFilterMismatch:
      description: Cursor is invalid or does not match the normalized filters and immutable snapshot.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example:
            code: CURSOR_FILTER_MISMATCH
            message: Cursor cannot be reused with a different filter set.
            details: [{field: cursor, reason: filter hash or snapshot does not match}]
            remediation: Restart pagination without a cursor using the desired filters.
            requestId: req_01JY8Z8F
    InternalError:
      description: Unexpected server failure that can be retried with the same safe request intent.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example:
            code: INTERNAL_ERROR
            message: The service could not complete the request.
            details: [{reason: unexpected server failure}]
            remediation: Retry later and provide the request ID to support if the failure persists.
            requestId: req_01JY8Z8F
    Conflict:
      description: Unique, external-state, idempotency or business conflict.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    StaleVersion:
      description: If-Match does not match current aggregate version.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example:
            code: STALE_VERSION
            message: Data changed after this screen was loaded.
            details: [{field: version, reason: 'expected 7, current 8'}]
            remediation: Compare the current server version, refresh, then retry the command.
            requestId: req_01JY8Z8F
    PreconditionFailed:
      description: >-
        Missing, malformed or stale strong If-Match precondition. The error code is
        PRECONDITION_REQUIRED for a missing required header and STALE_VERSION for a mismatch.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  code: {$ref: '#/components/schemas/PreconditionProblemCode'}
          example:
            code: STALE_VERSION
            message: Data changed after this screen was loaded.
            details: [{field: If-Match, reason: 'expected "7", current "8"'}]
            remediation: Refresh the resource, compare changes, then retry with its latest ETag.
            requestId: req_01JY8Z8F
    ValidationFailed:
      description: Field, restriction or compatibility validation failed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    StateTransitionFailed:
      description: Command is not allowed from the current state.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example:
            code: STATE_TRANSITION_NOT_ALLOWED
            message: Command is not allowed from the current state.
            details: [{field: state, reason: allowed actions are confirmReceipt and cancel}]
            remediation: Refresh the record and choose one of the allowed actions.
            requestId: req_01JY8Z8F
    InvariantFailed:
      description: Financial conservation, refund or closed-period invariant failed.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Expired:
      description: Quote, impersonation or command intent expired.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    PayloadTooLarge:
      description: Sync batch or media manifest exceeds device policy.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    JobAccepted:
      description: Durable asynchronous job accepted.
      headers:
        Location:
          schema: {type: string, format: uri-reference}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/JobResponse'}
    JobAcceptedWithEtag:
      description: Durable asynchronous job accepted for a versioned aggregate.
      headers:
        Location:
          schema: {type: string, format: uri-reference}
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/JobResponse'}
    CommandSucceeded:
      description: Command committed with its resulting aggregate version.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CommandResultResponse'}
  schemas:
    PreconditionProblemCode:
      type: string
      enum: [PRECONDITION_REQUIRED, PRECONDITION_INVALID, STALE_VERSION]
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [01JY8Z8F6ME4F0Y9QH2X6D4R7A]
    Decimal:
      type: string
      pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
      examples: ['123.50']
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [CNY]
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {$ref: '#/components/schemas/Decimal'}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
    ErrorCode:
      type: string
      enum:
        - AI_ACTION_NOT_ROLLBACKABLE
        - AI_LOW_CONFIDENCE
        - APPROVAL_REQUIRED
        - CARRIER_UNAVAILABLE
        - CHANNEL_RESTRICTION
        - CURSOR_FILTER_MISMATCH
        - DEVICE_EVENT_DUPLICATE
        - DEVICE_QUEUE_FULL
        - DEVICE_SYNC_CONFLICT
        - DISPATCH_PREFLIGHT_FAILED
        - DOWNSTREAM_DEPENDENCY_EXISTS
        - EVIDENCE_REQUIRED
        - FINANCIAL_INVARIANT_FAILED
        - IMPORT_PARTIAL_FAILURE
        - IMPORT_VALIDATION_FAILED
        - INTERNAL_ERROR
        - LAST_ADMIN_LOCKOUT
        - LOAD_INCOMPATIBLE
        - MODEL_UNAVAILABLE
        - NO_APPLICABLE_RATE
        - NOT_FOUND
        - NOTIFICATION_DELIVERY_PARTIAL
        - PAYMENT_CALLBACK_DUPLICATE
        - PAYMENT_FAILED
        - PERMISSION_DENIED
        - QUOTE_EXPIRED
        - RATE_VERSION_CHANGED
        - REVIEWED_CHARGE_IMMUTABLE
        - SESSION_EXPIRED
        - SESSION_REVOKED
        - SHIPMENT_ON_HOLD
        - STALE_VERSION
        - STATE_TRANSITION_NOT_ALLOWED
        - TAKEOVER_AUTHORIZATION_EXPIRED
        - TAKEOVER_EXPORT_INTEGRITY_FAILED
        - TRACKING_EVENT_DUPLICATE
        - VALIDATION_FAILED
        - WAREHOUSE_SWITCH_BLOCKED
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        field: {type: string}
        reason: {type: string}
        rejectedValue: {}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, details, remediation, requestId]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string}
        detail:
          type: string
          description: Problem Details compatible alias of message for API error filters.
        details:
          type: array
          items: {$ref: '#/components/schemas/ErrorDetail'}
        remediation: {type: string}
        requestId: {type: string}
    Meta:
      type: object
      additionalProperties: false
      properties:
        requestId: {type: string}
        nextCursor: {type: [string, 'null']}
        asOf: {type: string, format: date-time}
    OpaqueCursor:
      type: string
      minLength: 24
      maxLength: 2048
      pattern: '^[A-Za-z0-9_-]+$'
      description: Signed base64url token containing the snapshot, filter hash and order tuple.
    CursorPageMeta:
      type: object
      additionalProperties: false
      required: [requestId, nextCursor, asOf, filterHash, order]
      properties:
        requestId: {type: string, minLength: 1}
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/OpaqueCursor'
            - type: 'null'
        asOf: {type: string, format: date-time}
        filterHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        order:
          type: array
          minItems: 2
          items: {type: string, minLength: 1}
    HealthDependencyResult:
      type: object
      additionalProperties: false
      required: [status, latencyMs]
      properties:
        status: {type: string, enum: [up, down]}
        latencyMs: {type: integer, minimum: 0}
        detail:
          type: string
          description: Safe dependency class or timeout summary without credentials.
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: {type: string, enum: [ok, unavailable]}
        checks:
          type: object
          additionalProperties: {$ref: '#/components/schemas/HealthDependencyResult'}
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/ServiceHealth'}
        meta: {$ref: '#/components/schemas/Meta'}
    AllowedAction:
      type: object
      additionalProperties: false
      required: [action, enabled]
      properties:
        action: {type: string}
        enabled: {type: boolean}
        disabledReason: {type: [string, 'null']}
    CommandResult:
      type: object
      additionalProperties: false
      required: [resourceId, status, version]
      properties:
        resourceId: {type: string}
        status: {type: string}
        version: {type: integer, minimum: 1}
        jobId: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}
        domain:
          oneOf:
            - $ref: '#/components/schemas/DomainCatalog'
            - type: 'null'
    CommandResultResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/CommandResult'}
        meta: {$ref: '#/components/schemas/Meta'}
    Address:
