    LastMileIntakeResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/LastMileIntake'}
        meta: {$ref: '#/components/schemas/Meta'}
    CreateDeliveryTaskRequest:
      type: object
      required: [stationId, executorType, executorId, waybillIds, plannedWindow]
      properties:
        stationId: {$ref: '#/components/schemas/Ulid'}
        executorType: {type: string, enum: [DRIVER, PARTNER]}
        executorId: {$ref: '#/components/schemas/Ulid'}
        waybillIds: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Ulid'}}
        plannedWindow:
          type: object
          required: [startsAt, endsAt]
          properties:
            startsAt: {type: string, format: date-time}
