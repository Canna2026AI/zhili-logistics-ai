    DomainRecord:
      type: object
      description: Extensible contract shape refined by the owning domain module.
      additionalProperties: true
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        status: {type: string}
        version: {type: integer, minimum: 1}
        updatedAt: {type: string, format: date-time}
    DomainCatalog:
      description: Domain records returned by generic command acknowledgements.
      anyOf:
        - $ref: '#/components/schemas/Device'
        - $ref: '#/components/schemas/WarehouseScan'
        - $ref: '#/components/schemas/RoutingDecision'
        - $ref: '#/components/schemas/DispatchResult'
        - $ref: '#/components/schemas/TrackingStall'
        - $ref: '#/components/schemas/IssueMaterial'
        - $ref: '#/components/schemas/PaymentCallback'
        - $ref: '#/components/schemas/PaymentRefund'
        - $ref: '#/components/schemas/PaymentReconciliation'
        - $ref: '#/components/schemas/Approval'
    Device:
      description: Managed PDA device and warehouse binding.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    ShipmentHold:
      description: Audited shipment hold or authorized release command.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    WarehouseScan:
      description: Idempotent warehouse scan event and matched forecast.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    RoutingDecision:
      description: Chosen channel, alternatives and unavailable explanation.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    DispatchResult:
      description: Dispatch preflight result and handover snapshot.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    TrackingStall:
      description: Tracking stall detection evidence and automation outcome.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    IssueMaterial:
      description: Customer-visible material request and submitted evidence.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    Claim:
      description: Return, damage, loss or settled claim case.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    ChargeReview:
      description: Charge review, unreview or immutable adjustment record.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    CashTransaction:
      description: Receipt, disbursement or unapplied-cash transaction.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    Allocation:
      description: Versioned receipt or disbursement allocation.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    ExchangeRateSet:
      description: Published multi-currency rate set and base-currency snapshot.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    ProfitTrace:
      description: Reconciled revenue, cost, allocation and profit lineage.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    FinancialPeriod:
      description: Financial period close, adjustment and reopen state.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    InvoiceRequest:
      description: Invoice title, request, review, reversal and attachment state.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    PaymentCallback:
      description: Verified and deduplicated WeChat Pay callback.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    PaymentRefund:
      description: Full or partial refund constrained by original payment balance.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    PaymentReconciliation:
      description: WeChat bill reconciliation run and isolated exceptions.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    ReportResult:
      description: Reconciled metric result with drill-down dimensions.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    DocumentTemplate:
      description: Versioned label, statement, packing-list, invoice or handover template.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    ExportJob:
      description: Audited asynchronous export field, format and masking policy.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    AutomationRule:
      description: Versioned event, condition, action and risk policy.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    AutomationRun:
      description: Automation execution, retry, compensation and replay state.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    Approval:
      description: Critical action approval decision with evidence.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    NotificationTemplate:
      description: Versioned in-app, email, WeCom or webhook template.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    ApiClient:
      description: Scoped rate-limited API client and secret lifecycle.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    WebhookEndpoint:
      description: Signed webhook endpoint, replay protection and dead-letter policy.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    Connector:
      description: External connector credentials, health and checkpoint state.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    ConnectorMapping:
      description: Versioned external-to-internal field mapping and reconciliation state.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    AiExplanation:
      description: Grounded model explanation with rule and evidence versions.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    AiSuggestion:
      description: Policy-filtered classification or customer-reply suggestion.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    CustomerDashboard:
      description: Customer portal orders, waybills, tracking and task aggregates.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    CustomerFinanceSummary:
      description: Customer statements, prepayments, payments, refunds and invoices.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    ApiAccessRequest:
      description: Customer scoped API-access request and review state.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    SeoMetadata:
      type: object
      additionalProperties: false
      required: [title, description, canonicalUrl]
      properties:
        title: {type: string, minLength: 1, maxLength: 70}
        description: {type: string, minLength: 1, maxLength: 180}
        canonicalUrl: {type: string, format: uri}
        robots: {type: string, enum: [index-follow, noindex-follow, noindex-nofollow]}
        structuredData:
          type: object
          additionalProperties: true
    StaticPage:
      type: object
      additionalProperties: false
      required: [slug, title, sections, seo, publishedAt]
      properties:
        slug: {type: string, pattern: '^[a-z0-9-]+$'}
        title: {type: string, minLength: 1}
        sections:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, heading, body]
            properties:
              id: {type: string}
              heading: {type: string}
              body: {type: string}
        seo: {$ref: '#/components/schemas/SeoMetadata'}
        publishedAt: {type: string, format: date-time}
    LegalDocument:
      description: Published privacy, terms or license document version.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
        - $ref: '#/components/schemas/StaticPage'
    SystemHealth:
      description: Health, metrics, queues, logs and trace summary.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    RecoveryDrill:
      description: Backup restore drill, recovery objectives and audit evidence.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    MigrationRun:
      description: Full or incremental migration validation, cutover and rollback window.
      allOf:
        - $ref: '#/components/schemas/DomainRecord'
    Job:
      type: object
      required: [id, type, status, progress, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        type: {type: string}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]}
        progress: {type: number, minimum: 0, maximum: 1}
        resultRef: {type: [string, 'null']}
        error: {oneOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: 'null'}]}
        createdAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
    JobResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/Job'}
        meta: {$ref: '#/components/schemas/Meta'}
