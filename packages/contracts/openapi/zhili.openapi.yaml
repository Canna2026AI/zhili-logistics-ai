    DeviceTaskListResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/DeviceTask'}}
        meta: {$ref: '#/components/schemas/Meta'}
    UploadDeviceMediaRequest:
      type: object
      additionalProperties: false
      required: [eventId, mediaId, contentHash, file]
      properties:
        eventId:
          $ref: '#/components/schemas/Ulid'
          description: Must equal the transition or POD deviceEventId that will claim this reservation.
        mediaId: {type: string}
        contentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase SHA-256 of the uploaded media bytes.
        file: {type: string, format: binary}
    DeviceScope:
      type: object
      additionalProperties: false
      description: Server-owned tenant, warehouse, subject and device binding.
      required: [tenantId, warehouseId, subjectId, deviceId]
      properties:
        tenantId: {$ref: '#/components/schemas/Ulid'}
        warehouseId: {$ref: '#/components/schemas/Ulid'}
        subjectId: {$ref: '#/components/schemas/Ulid'}
        deviceId: {$ref: '#/components/schemas/Ulid'}
    DeviceMedia:
      type: object
      additionalProperties: false
      description: >-
        A server-scoped reservation for one client event. UPLOADED means reserved bytes were accepted but not claimed. READY only after an atomic transition or POD claim, or after device event sync returns APPLIED or DUPLICATE
        for the same eventId; upload by itself never completes the media.
      required: [mediaId, eventId, scope, status, objectRef, expiresAt]
      properties:
        mediaId: {type: string}
        eventId: {$ref: '#/components/schemas/Ulid'}
        scope: {$ref: '#/components/schemas/DeviceScope'}
        status: {type: string, enum: [UPLOADED, SCANNING, READY, REJECTED]}
        objectRef:
          type: string
          description: Opaque reservation reference; never a public object URL.
        expiresAt: {type: string, format: date-time}
    DeviceMediaResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/DeviceMedia'}
        meta: {$ref: '#/components/schemas/Meta'}
    DeviceEventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, deviceId, localSequence, tenantId, warehouseId, subjectId, action, entityRef, payload, mediaRefs, baseVersion, idempotencyKey, occurredAt, timezone, appVersion]
      properties:
        eventId: {$ref: '#/components/schemas/Ulid'}
        deviceId: {$ref: '#/components/schemas/Ulid'}
        localSequence: {type: integer, minimum: 1}
        tenantId: {$ref: '#/components/schemas/Ulid'}
        warehouseId: {$ref: '#/components/schemas/Ulid'}
        subjectId: {$ref: '#/components/schemas/Ulid'}
        action: {type: string}
        entityRef: {type: string}
        payload: {type: object, additionalProperties: true}
        mediaRefs: {type: array, items: {type: string}}
        baseVersion: {type: integer, minimum: 0}
        idempotencyKey: {type: string, minLength: 16, maxLength: 128}
        occurredAt: {type: string, format: date-time}
        timezone: {type: string}
        appVersion: {type: string}
    SyncDeviceEventsRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/DeviceEventEnvelope'}
    DeviceEventSyncResult:
      type: object
      description: >-
        APPLIED or DUPLICATE atomically claims scoped mediaRefs and makes accepted media
        READY. CONFLICT and REJECTED leave reservations unclaimed for retry or takeover.
      required: [eventId, disposition, claimedMediaRefs]
      properties:
        eventId: {$ref: '#/components/schemas/Ulid'}
        disposition: {type: string, enum: [APPLIED, DUPLICATE, CONFLICT, REJECTED]}
        claimedMediaRefs:
          type: array
          uniqueItems: true
          items: {type: string}
        serverVersion: {type: integer}
        conflictId: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}]}
        conflictVersion: {type: integer, minimum: 1}
        error: {oneOf: [{$ref: '#/components/schemas/ErrorEnvelope'}, {type: 'null'}]}
    SyncDeviceEventsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/DeviceEventSyncResult'}
        meta: {$ref: '#/components/schemas/Meta'}
    AuthorizeDeviceTakeoverExportRequest:
      type: object
      additionalProperties: false
      description: Declares the complete local package before a server key is issued.
      required: [reason, manifestHash, eventCount, mediaCount]
      properties:
        reason: {type: string, minLength: 5, maxLength: 500}
        manifestHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase SHA-256 of the canonical plaintext manifest.
        eventCount: {type: integer, minimum: 1}
        mediaCount: {type: integer, minimum: 0}
    RsaOaepPublicJwk:
      type: object
      additionalProperties: false
      description: Ephemeral public wrapping key. Private key material is never returned.
      required: [kty, kid, use, alg, key_ops, n, e]
      properties:
        kty: {type: string, enum: [RSA]}
        kid: {type: string, minLength: 1}
        use: {type: string, enum: [enc]}
        alg: {type: string, enum: [RSA-OAEP-256]}
        key_ops:
          type: array
          minItems: 1
          maxItems: 1
          items: {type: string, enum: [wrapKey]}
        n: {type: string, minLength: 1, description: Base64url modulus without padding.}
        e: {type: string, minLength: 1, description: Base64url exponent without padding.}
    DeviceTakeoverExportAuthorization:
      type: object
      additionalProperties: false
      description: >-
        Server-issued authorization bound to one device scope and declared manifest. It
        expires no later than five minutes after issuance and cannot be client-created.
      required: [authorizationId, deviceId, scope, manifestHash, eventCount, mediaCount, expiresAt, keyEncryptionAlgorithm, contentEncryptionAlgorithm, publicKeyJwk, maxCiphertextBytes, status]
      properties:
        authorizationId: {$ref: '#/components/schemas/Ulid'}
        deviceId: {$ref: '#/components/schemas/Ulid'}
        scope: {$ref: '#/components/schemas/DeviceScope'}
        manifestHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        eventCount: {type: integer, minimum: 1}
        mediaCount: {type: integer, minimum: 0}
        expiresAt: {type: string, format: date-time}
        keyEncryptionAlgorithm: {type: string, enum: [RSA-OAEP-256]}
        contentEncryptionAlgorithm: {type: string, enum: [A256GCM]}
        publicKeyJwk: {$ref: '#/components/schemas/RsaOaepPublicJwk'}
        maxCiphertextBytes: {type: integer, minimum: 1}
        status: {type: string, enum: [AUTHORIZED]}
    DeviceTakeoverExportAuthorizationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/DeviceTakeoverExportAuthorization'}
        meta: {$ref: '#/components/schemas/Meta'}
    UploadEncryptedDeviceTakeoverExportRequest:
      type: object
      additionalProperties: false
      description: >-
        Multipart envelope with no plaintext business payload. ciphertext is an
        AES-256-GCM encrypted archive of the canonical manifest, all events and all
        referenced media, with the 128-bit authentication tag appended. wrappedKey is
        the 256-bit AES key wrapped by the authorization RSA-OAEP-256 public key.
      required: [manifestHash, ciphertextHash, ciphertext, iv, wrappedKey]
      properties:
        manifestHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        ciphertextHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase SHA-256 of ciphertext including its GCM tag.
        ciphertext: {type: string, format: binary}
        iv:
          type: string
          format: byte
          description: Exactly 12 random bytes, base64 encoded for multipart transport.
        wrappedKey: {type: string, format: binary}
    DeviceTakeoverExportReceipt:
      type: object
      additionalProperties: false
      description: >-
        Server audit receipt. Clients may clear protected local events and media only
        when status is VERIFIED and both returned hashes match the submitted package.
      required: [exportId, authorizationId, deviceId, scope, manifestHash, ciphertextHash, eventCount, mediaCount, checksumAlgorithm, status, receivedAt]
      properties:
        exportId: {$ref: '#/components/schemas/Ulid'}
        authorizationId: {$ref: '#/components/schemas/Ulid'}
        deviceId: {$ref: '#/components/schemas/Ulid'}
        scope: {$ref: '#/components/schemas/DeviceScope'}
        manifestHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        ciphertextHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        eventCount: {type: integer, minimum: 1}
        mediaCount: {type: integer, minimum: 0}
        checksumAlgorithm: {type: string, enum: [SHA-256]}
        status: {type: string, enum: [RECEIVED, VERIFIED, REJECTED]}
        receivedAt: {type: string, format: date-time}
        verifiedAt: {type: [string, 'null'], format: date-time}
    DeviceTakeoverExportReceiptResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/DeviceTakeoverExportReceipt'}
        meta: {$ref: '#/components/schemas/Meta'}
    ResolveDeviceConflictRequest:
