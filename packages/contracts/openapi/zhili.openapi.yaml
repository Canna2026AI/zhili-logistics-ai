        stationId: {$ref: '#/components/schemas/Ulid'}
        sourceType: {type: string, enum: [LINEHAUL, PARTNER]}
        expectedWaybillIds: {type: array, items: {$ref: '#/components/schemas/Ulid'}}
    LastMileIntake:
      type: object
      required: [id, intakeNo, status, expectedCount, scannedCount, version]
